# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Dependabot uses the npm ecosystem value for npm, pnpm, and Yarn projects.
  # The root pnpm lockfile covers the monorepo workspace packages.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'

  # The Next.js dashboard has its own npm lockfile outside the root pnpm workspace.
  - package-ecosystem: 'npm'
    directory: '/apps/CodeVitals-MCP/website'
    schedule:
      interval: 'weekly'
